<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>تأكيد البريد الجديد - كوپا</title>
</head>
<body style="margin:0;padding:0;background:#F4F6F7;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F6F7;padding:24px 12px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#FFFFFF;border-radius:16px;overflow:hidden;">
        <tr>
          <td style="background:#1A7A78;padding:22px 28px;text-align:right;font-family:Tahoma,'Segoe UI',Arial,sans-serif;font-size:26px;font-weight:700;color:#FFFFFF;">كوپا</td>
        </tr>
        <tr>
          <td style="padding:28px;text-align:right;font-family:Tahoma,'Segoe UI',Arial,sans-serif;color:#0B1515;direction:rtl;">
            <h1 style="margin:0 0 14px;font-size:20px;line-height:1.5;color:#0B1515;">تأكيد عنوان البريد الجديد</h1>
            <p style="margin:0 0 22px;font-size:15px;line-height:1.9;color:#33413F;">طلبت تغيير بريد حسابك من <strong dir="ltr">{{ .Email }}</strong> إلى <strong dir="ltr">{{ .NewEmail }}</strong>. اضغط الزر أدناه لتأكيد هذا التغيير.</p>
            <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 22px;">
              <tr>
                <td style="background:#1A7A78;border-radius:10px;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 26px;font-family:Tahoma,'Segoe UI',Arial,sans-serif;font-size:16px;font-weight:700;color:#FFFFFF;text-decoration:none;">تأكيد البريد الجديد</a>
                </td>
              </tr>
            </table>
            <p style="margin:0 0 6px;font-size:13px;line-height:1.8;color:#5B6B69;">إن لم يعمل الزر، انسخ هذا الرابط وافتحه في المتصفح:</p>
            <p dir="ltr" style="margin:0 0 22px;font-size:12px;line-height:1.6;color:#5B6B69;text-align:left;word-break:break-all;">{{ .ConfirmationURL }}</p>
            <p style="margin:0;padding-top:16px;border-top:1px solid #E3E8E7;font-size:13px;line-height:1.8;color:#5B6B69;">إذا لم تطلب هذا التغيير، تجاهل الرسالة وتواصل معنا فورا.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
