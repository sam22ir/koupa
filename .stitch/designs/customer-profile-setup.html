<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>إعداد الملف الشخصي - Koupa</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Public+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#006a68",
                        "on-tertiary-fixed-variant": "#703717",
                        "surface-container": "#ebefed",
                        "primary-fixed-dim": "#81d5d2",
                        "on-tertiary-container": "#ffeee7",
                        "surface-container-low": "#f1f4f3",
                        "secondary-container": "#c8e9e7",
                        "primary": "#00605e",
                        "on-background": "#181c1c",
                        "surface-variant": "#e0e3e2",
                        "on-surface": "#181c1c",
                        "primary-fixed": "#9df1ee",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#2d3131",
                        "tertiary-fixed": "#ffdbcb",
                        "on-secondary-fixed-variant": "#2e4c4b",
                        "surface-dim": "#d7dbda",
                        "on-secondary-container": "#4c6a68",
                        "tertiary": "#824625",
                        "surface-container-lowest": "#ffffff",
                        "background": "#f7faf9",
                        "error": "#ba1a1a",
                        "outline-variant": "#bdc9c8",
                        "tertiary-fixed-dim": "#ffb692",
                        "on-primary-fixed-variant": "#00504e",
                        "surface-container-high": "#e5e9e8",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#00201f",
                        "surface-container-highest": "#e0e3e2",
                        "primary-container": "#1a7a78",
                        "inverse-on-surface": "#eef1f0",
                        "on-primary-container": "#b3fffc",
                        "surface-bright": "#f7faf9",
                        "on-error": "#ffffff",
                        "inverse-primary": "#81d5d2",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#adcdcb",
                        "on-tertiary-fixed": "#341100",
                        "secondary": "#466462",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#c8e9e7",
                        "on-primary-fixed": "#00201f",
                        "outline": "#6e7978",
                        "tertiary-container": "#9f5d3a",
                        "surface": "#f7faf9",
                        "on-surface-variant": "#3e4948",
                        "on-secondary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["IBM Plex Sans Arabic", "sans-serif"],
                        "display": ["IBM Plex Sans Arabic", "sans-serif"],
                        "body": ["IBM Plex Sans Arabic", "sans-serif"],
                        "label": ["Public Sans", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'IBM Plex Sans Arabic', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#F3F5F7] text-[#323E4B] antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface text-on-surface flex flex-row-reverse justify-between items-center px-4 w-full h-16 font-body docked full-width top-0 bg-surface-container transition-colors duration-200">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary hover:bg-surface-variant rounded-full p-2 cursor-pointer transition-colors duration-200">help</span>
</div>
<div class="font-headline text-primary font-bold text-xl flex items-center justify-center">
            إعداد الملف الشخصي
        </div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary hover:bg-surface-variant rounded-full p-2 cursor-pointer transition-colors duration-200">arrow_forward</span>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col px-6 pt-6 pb-24 max-w-md mx-auto w-full">
<!-- Step Indicator -->
<div class="mb-8 w-full">
<div class="flex justify-between items-center mb-2">
<span class="text-sm font-medium text-primary">الخطوة 1 من 2</span>
<span class="text-sm text-outline">إعداد الملف الشخصي</span>
</div>
<div class="h-1.5 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-1/2 rounded-full"></div>
</div>
</div>
<!-- Title -->
<div class="mb-8">
<h1 class="text-3xl font-bold font-headline text-on-surface mb-2">أخبرنا المزيد عنك</h1>
<p class="text-on-surface-variant text-sm">أدخل معلوماتك الشخصية لإنشاء حسابك.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-6 w-full">
<!-- Full Name Input -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-on-surface" for="fullName">الاسم الكامل</label>
<div class="relative">
<input class="w-full h-14 bg-surface rounded-[12px] border border-outline-variant px-4 text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-shadow" id="fullName" placeholder="أدخل اسمك بالكامل" type="text" value=""/>
</div>
</div>
<!-- Phone Number Input -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-on-surface" for="phoneNumber">رقم الهاتف</label>
<div class="flex h-14 bg-surface rounded-[12px] border border-outline-variant overflow-hidden focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-shadow">
<div class="flex items-center justify-center px-4 bg-surface-variant text-on-surface border-l border-outline-variant" dir="ltr">
                        +213
                    </div>
<input class="w-full h-full bg-transparent border-none px-4 text-on-surface focus:outline-none focus:ring-0" dir="ltr" id="phoneNumber" placeholder="5XXXXXXXX" type="tel"/>
</div>
<p class="text-xs text-outline flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-[14px]">info</span>
                    رقم الهاتف هو وسيلة تواصل غير موثقة حالياً
                </p>
</div>
<!-- Actions -->
<div class="mt-8 pt-4">
<button class="w-full h-14 bg-[#1A7A78] hover:bg-primary text-white rounded-[12px] font-semibold text-lg flex justify-center items-center gap-2 transition-colors duration-200" type="button">
                    حفظ واستمرار
                </button>
</div>
</form>
</main>
</body></html>
