<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>

<title>Barber Onboarding - Step 1</title>

                    "surface-dim": "#d7dbda",

                    "outline": "#6e7978",
                    "inverse-on-surface": "#eef1f0",
                    "surface-container": "#ebefed",
                    "on-tertiary-fixed": "#341100",

                    "surface": "#f7faf9",

                    "on-primary-fixed-variant": "#00504e",

<style>
        body { font-family: 'IBM Plex Sans Arabic', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center justify-center p-4">
<!-- TopAppBar JSON 2 -->
<header class="fixed top-0 w-full flex flex-row-reverse items-center justify-between px-4 h-16 bg-surface border-b border-outline-variant z-50">
<button class="text-on-surface-variant flex items-center gap-1 font-label text-sm hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
            رجوع
        </button>
<span class="font-bold text-primary font-label text-sm">Step 1 of 5</span>
<div class="w-16"></div> <!-- Spacer for balance -->
</header>
<main class="w-full max-w-md mx-auto mt-24 mb-20 bg-surface-container-lowest rounded-xl shadow-sm p-6 md:p-8">
<div class="mb-8 text-center">
<h1 class="font-headline text-2xl font-bold text-on-surface mb-2">المعلومات الأساسية</h1>
<p class="font-body text-on-surface-variant text-sm">أخبرنا قليلاً عن نفسك وحرفتك</p>
</div>
<form class="space-y-6">
<!-- Full Name -->
<div>
<label class="block font-label text-sm font-medium text-on-surface mb-1" for="fullName">الاسم الكامل</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all placeholder-on-surface-variant/50" id="fullName" placeholder="الاسم الكامل" type="text"/>
</div>
<!-- Professional Bio -->
<div>
<label class="block font-label text-sm font-medium text-on-surface mb-1" for="bio">النبذة الشخصية</label>
<textarea class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all placeholder-on-surface-variant/50 resize-none" id="bio" placeholder="صف خبرتك باختصار..." rows="4"></textarea>
</div>
<!-- Phone Number -->
<div>
<label class="block font-label text-sm font-medium text-on-surface mb-1" for="phone">رقم الهاتف</label>
<div class="flex flex-row-reverse rounded-lg border border-outline-variant overflow-hidden focus-within:ring-2 focus-within:ring-primary-container focus-within:border-transparent transition-all">
<span class="bg-surface-container-low px-4 py-3 text-on-surface-variant font-label text-sm border-l border-outline-variant flex items-center" dir="ltr">+213</span>
<input class="w-full bg-surface border-none px-4 py-3 text-on-surface focus:ring-0 text-left" dir="ltr" id="phone" placeholder="555 123 456" type="tel"/>
</div>
</div>
</form>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 w-full bg-surface border-t border-outline-variant p-4 flex justify-center z-50">
<div class="w-full max-w-md">
<button class="w-full bg-primary-container hover:bg-primary-container/90 text-on-primary-container font-headline font-semibold py-3.5 rounded-xl transition-all shadow-sm active:scale-[0.98]">
                استمرار
            </button>
</div>
</div>
</body></html>
