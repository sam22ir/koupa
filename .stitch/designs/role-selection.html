    body {

<body class="bg-background text-on-surface h-screen flex flex-col antialiased relative">
<!-- Transactional Screen - Navigation Shell Suppressed -->
<!-- Header (Simple placeholder for logo) -->
<header class="w-full flex items-center justify-center h-16 pt-4 px-4 bg-background">
<!-- Exact Logo Placement Reserve -->
<div class="h-8 w-24 border border-dashed border-outline-variant rounded flex items-center justify-center text-outline text-xs">
            كوبا
        </div>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col px-6 pt-8 pb-4">
<!-- Header Text -->
<div class="mb-8 text-center space-y-2">
<h1 class="text-3xl font-headline font-bold text-on-surface">مرحباً بك في كوبا</h1>
<p class="text-base text-on-surface-variant">اختر نوع حسابك للبدء</p>
</div>
<!-- Role Selection Panels -->
<div class="space-y-4 mb-8">
<!-- Customer Panel (Selected State example) -->
<label class="block relative cursor-pointer group">
<input checked="" class="peer sr-only" name="role" onchange="toggleContinueBtn()" type="radio" value="customer"/>
<div class="bg-surface-container-lowest border-2 border-primary rounded-xl p-5 flex items-start gap-4 transition-all shadow-sm">
<div class="bg-primary/10 text-primary p-3 rounded-lg shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">person</span>
</div>
<div class="flex-1">
<h2 class="text-lg font-bold text-on-surface mb-1">عميل</h2>
<p class="text-sm text-on-surface-variant leading-relaxed">احجز موعدك بسهولة مع أفضل الحلاقين</p>
</div>
<!-- Selection Indicator -->
<div class="h-6 w-6 rounded-full border-2 border-primary flex items-center justify-center bg-primary shrink-0 self-center">
<span class="material-symbols-outlined text-on-primary text-sm font-bold">check</span>
</div>
</div>
</label>
<!-- Barber Panel -->
<label class="block relative cursor-pointer group">
<input class="peer sr-only" name="role" onchange="toggleContinueBtn()" type="radio" value="barber"/>
<div class="bg-surface-container-lowest border-2 border-outline-variant/30 peer-checked:border-primary rounded-xl p-5 flex items-start gap-4 transition-all hover:border-outline-variant/60 shadow-sm">
<div class="bg-surface-container text-on-surface-variant p-3 rounded-lg shrink-0 peer-checked:bg-primary/10 peer-checked:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">content_cut</span>
</div>
<div class="flex-1">
<h2 class="text-lg font-bold text-on-surface mb-1">حلاق</h2>
<p class="text-sm text-on-surface-variant leading-relaxed">إدارة حجوزاتك ونمو عملك مع كوبا</p>
</div>
<!-- Selection Indicator -->
<div class="h-6 w-6 rounded-full border-2 border-outline-variant/50 flex items-center justify-center shrink-0 self-center peer-checked:border-primary peer-checked:bg-primary transition-colors">
<span class="material-symbols-outlined text-transparent peer-checked:text-on-primary text-sm font-bold">check</span>
</div>
</div>
</label>
</div>
<div class="mt-auto">
<!-- Continue Button -->
<!-- Initially styling as disabled per prompt, though script makes it active if checked -->
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-bold text-lg shadow-md disabled:opacity-50 disabled:bg-outline disabled:shadow-none transition-all active:scale-[0.98]" id="continueBtn">
                استمرار
            </button>
<!-- Sign In Link -->
<div class="mt-6 text-center">
<p class="text-on-surface-variant text-sm">
                    لديك حساب بالفعل؟ 
                    <a class="text-primary font-bold hover:underline underline-offset-4 decoration-tertiary" href="#">تسجيل الدخول</a>
</p>
</div>
</div>
</main>
<script>
        // Simple interaction to enable button if a role is selected (though one is default checked for demo)
        function toggleContinueBtn() {
            const btn = document.getElementById('continueBtn');
            const radios = document.querySelectorAll('input[name="role"]');
            let isChecked = false;
            radios.forEach(radio => {
                if (radio.checked) isChecked = true;
                
                // Update indicator styling based on state (handled mostly by CSS, but syncing inner checkmark color for non-checked state just in case)
                const panel = radio.closest('label');
                const checkIcon = panel.querySelector('.material-symbols-outlined:last-child');
                if(!radio.checked) {
                     checkIcon.classList.remove('text-on-primary');
                     checkIcon.classList.add('text-transparent');
                } else {
                     checkIcon.classList.add('text-on-primary');
                     checkIcon.classList.remove('text-transparent');
                }
            });
            btn.disabled = !isChecked;
        }
        
        // Init state
        toggleContinueBtn();
    </script>
</body></html>
