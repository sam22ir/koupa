<!DOCTYPE html>

<style>
        body { font-family: 'IBM Plex Sans Arabic', sans-serif; }
        .toggle-checkbox:checked {
            right: 0;
            border-color: #1a7a78;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #1a7a78;
        }
        .toggle-checkbox:checked + .toggle-label:after {
            transform: translateX(100%);
        }
    </style>
<style>
    body {

<body class="bg-background text-on-background min-h-screen flex flex-col pb-24">
<!-- Top App Bar (From JSON Shell Logic) -->
<header class="bg-surface dark:bg-surface-dim docked full-width top-0 bg-surface-container-low dark:bg-surface-container-lowest flat no shadows flex flex-row-reverse justify-between items-center w-full px-4 h-16 sticky z-40">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors rounded-full p-2 scale-95 active:opacity-80 transition-transform">
<span class="material-symbols-outlined">more_vert</span>
</button>
<div class="font-headline text-on-surface text-right font-display font-bold text-primary dark:text-primary-fixed-dim">
            التسجيل
        </div>
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors rounded-full p-2 scale-95 active:opacity-80 transition-transform">
<span class="material-symbols-outlined" style="transform: scaleX(-1);">arrow_forward</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center px-4 pt-6">
<div class="w-full max-w-2xl">
<!-- Progress Indicator -->
<div class="mb-8">
<p class="text-sm font-medium text-on-surface-variant mb-2">الخطوة 4 من 5</p>
<div class="w-full bg-surface-variant rounded-full h-1.5">
<div class="bg-primary-container h-1.5 rounded-full" style="width: 80%"></div>
</div>
</div>
<!-- Headers -->
<div class="mb-8">
<h1 class="text-2xl font-bold font-display text-on-background mb-2">الجدول الأسبوعي</h1>
<p class="text-on-surface-variant">حدد ساعات عملك وفترات المواعيد.</p>
</div>
<!-- 1. Working Days & Hours Bento Style -->
<section class="bg-surface-container-low rounded-xl p-5 mb-6 border border-outline-variant/30 shadow-sm">
<h2 class="text-lg font-bold mb-4">أيام وساعات العمل</h2>
<div class="space-y-4">
<!-- Sunday -->
<div class="flex flex-col sm:flex-row sm:items-center justify-between p-3 bg-surface rounded-lg border border-outline-variant/20 transition-all focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container">
<div class="flex items-center gap-3 mb-3 sm:mb-0 w-32">
<div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-transform duration-200 ease-in-out left-0 top-0" id="toggle-sun" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-5 rounded-full bg-surface-variant cursor-pointer" for="toggle-sun"></label>
</div>
<span class="font-medium">الأحد</span>
</div>
<div class="flex items-center gap-2 flex-grow sm:justify-end">
<input class="block w-full sm:w-28 rounded-lg border-0 py-1.5 px-3 text-on-surface shadow-sm ring-1 ring-inset ring-outline-variant placeholder:text-outline focus:ring-2 focus:ring-inset focus:ring-primary-container sm:text-sm sm:leading-6 bg-surface" type="time" value="09:00"/>
<span class="text-on-surface-variant text-sm">إلى</span>
<input class="block w-full sm:w-28 rounded-lg border-0 py-1.5 px-3 text-on-surface shadow-sm ring-1 ring-inset ring-outline-variant placeholder:text-outline focus:ring-2 focus:ring-inset focus:ring-primary-container sm:text-sm sm:leading-6 bg-surface" type="time" value="18:00"/>
</div>
</div>
<!-- Monday -->
<div class="flex flex-col sm:flex-row sm:items-center justify-between p-3 bg-surface rounded-lg border border-outline-variant/20 transition-all focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container">
<div class="flex items-center gap-3 mb-3 sm:mb-0 w-32">
<div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-transform duration-200 ease-in-out left-0 top-0" id="toggle-mon" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-5 rounded-full bg-surface-variant cursor-pointer" for="toggle-mon"></label>
</div>
<span class="font-medium">الإثنين</span>
</div>
<div class="flex items-center gap-2 flex-grow sm:justify-end">
<input class="block w-full sm:w-28 rounded-lg border-0 py-1.5 px-3 text-on-surface shadow-sm ring-1 ring-inset ring-outline-variant placeholder:text-outline focus:ring-2 focus:ring-inset focus:ring-primary-container sm:text-sm sm:leading-6 bg-surface" type="time" value="09:00"/>
<span class="text-on-surface-variant text-sm">إلى</span>
<input class="block w-full sm:w-28 rounded-lg border-0 py-1.5 px-3 text-on-surface shadow-sm ring-1 ring-inset ring-outline-variant placeholder:text-outline focus:ring-2 focus:ring-inset focus:ring-primary-container sm:text-sm sm:leading-6 bg-surface" type="time" value="18:00"/>
</div>
</div>
<!-- Tuesday -->
<div class="flex flex-col sm:flex-row sm:items-center justify-between p-3 bg-surface rounded-lg border border-outline-variant/20 opacity-60">
<div class="flex items-center gap-3 mb-3 sm:mb-0 w-32">
<div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-transform duration-200 ease-in-out left-0 top-0" id="toggle-tue" name="toggle" type="checkbox"/>
<label class="block overflow-hidden h-5 rounded-full bg-surface-variant cursor-pointer" for="toggle-tue"></label>
</div>
<span class="font-medium text-on-surface-variant">الثلاثاء</span>
</div>
<div class="flex items-center gap-2 flex-grow sm:justify-end">
<span class="text-on-surface-variant text-sm bg-surface-container py-1.5 px-4 rounded-lg w-full sm:w-auto text-center">مغلق</span>
</div>
</div>
</div>
</section>
<!-- 2. Appointment Interval -->
<section class="bg-surface-container-low rounded-xl p-5 mb-6 border border-outline-variant/30 shadow-sm">
<h2 class="text-lg font-bold mb-4">مدة الموعد</h2>
<div class="flex flex-wrap gap-3">
<button class="px-5 py-2 rounded-xl border border-outline-variant text-on-surface-variant hover:bg-surface-container transition-colors bg-surface font-medium">5 دقائق</button>
<button class="px-5 py-2 rounded-xl border border-outline-variant text-on-surface-variant hover:bg-surface-container transition-colors bg-surface font-medium">10 دقائق</button>
<button class="px-5 py-2 rounded-xl border-transparent bg-primary-container text-on-primary font-medium shadow-sm ring-2 ring-primary-container ring-offset-1 ring-offset-background">15 دقيقة</button>
<button class="px-5 py-2 rounded-xl border border-outline-variant text-on-surface-variant hover:bg-surface-container transition-colors bg-surface font-medium">30 دقيقة</button>
</div>
</section>
<!-- 3. Breaks -->
<section class="bg-surface-container-low rounded-xl p-5 mb-8 border border-outline-variant/30 shadow-sm">
<div class="flex justify-between items-center mb-4">
<h2 class="text-lg font-bold">الاستراحات</h2>
<button class="flex items-center gap-1 text-primary-container font-medium hover:text-primary transition-colors text-sm bg-primary-container/10 px-3 py-1.5 rounded-lg">
<span class="material-symbols-outlined text-sm">add</span>
                        إضافة استراحة
                    </button>
</div>
<div class="space-y-3">
<div class="flex items-center justify-between p-3 bg-surface rounded-lg border border-outline-variant/20">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant">coffee</span>
<div>
<p class="font-medium text-sm">استراحة الغداء</p>
<p class="text-xs text-on-surface-variant">1:00 م - 2:00 م</p>
</div>
</div>
<button class="text-error hover:bg-error-container p-2 rounded-full transition-colors">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
</section>
</div>
</main>
<!-- Bottom Nav Bar (From JSON - Linear Flow Logic Applied) -->
<nav class="fixed bottom-0 w-full z-50 border-t border-outline-variant dark:border-outline shadow-sm fixed bottom-0 left-0 w-full z-50 flex flex-row-reverse justify-between items-center px-6 py-3 bg-surface dark:bg-surface-dim">
<button class="flex flex-col items-center justify-center bg-primary dark:bg-primary-container text-on-primary dark:text-on-primary-container rounded-xl px-6 py-2 tap-highlight-transparent active:scale-98 transition-all w-32 font-label text-sm font-medium">
<span class="material-symbols-outlined mb-1">chevron_left</span>
            استمرار
        </button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-6 py-2 hover:bg-primary-container/20 dark:hover:bg-primary-fixed-dim/10 tap-highlight-transparent active:scale-98 transition-all w-32 border border-outline-variant rounded-xl font-label text-sm font-medium bg-surface">
<span class="material-symbols-outlined mb-1">chevron_right</span>
            رجوع
        </button>
</nav>
<script>
        // Simple logic to toggle the Tuesday visual state based on checkbox
        document.getElementById('toggle-tue').addEventListener('change', function(e) {
            const container = this.closest('.flex-col');
            const statusSpan = container.querySelector('span.bg-surface-container');
            
            if(e.target.checked) {
                container.classList.remove('opacity-60');
                container.classList.add('focus-within:border-primary-container', 'focus-within:ring-1', 'focus-within:ring-primary-container');
                container.querySelector('label').classList.add('bg-primary-container');
                
                // Replace "Closed" with time inputs dynamically for demo
                const rightSide = container.querySelector('.flex-grow');
                rightSide.innerHTML = `
                    <input type="time" value="09:00" class="block w-full sm:w-28 rounded-lg border-0 py-1.5 px-3 text-on-surface shadow-sm ring-1 ring-inset ring-outline-variant placeholder:text-outline focus:ring-2 focus:ring-inset focus:ring-primary-container sm:text-sm sm:leading-6 bg-surface">
                    <span class="text-on-surface-variant text-sm">إلى</span>
                    <input type="time" value="18:00" class="block w-full sm:w-28 rounded-lg border-0 py-1.5 px-3 text-on-surface shadow-sm ring-1 ring-inset ring-outline-variant placeholder:text-outline focus:ring-2 focus:ring-inset focus:ring-primary-container sm:text-sm sm:leading-6 bg-surface">
                `;
            } else {
                container.classList.add('opacity-60');
                container.classList.remove('focus-within:border-primary-container', 'focus-within:ring-1', 'focus-within:ring-primary-container');
                
                const rightSide = container.querySelector('.flex-grow');
                rightSide.innerHTML = `<span class="text-on-surface-variant text-sm bg-surface-container py-1.5 px-4 rounded-lg w-full sm:w-auto text-center">مغلق</span>`;
            }
        });
    </script>
</body></html>
