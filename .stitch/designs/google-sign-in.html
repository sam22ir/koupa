                        "secondary-container": "#c8e9e7",
                        "secondary-fixed": "#c8e9e7",
                        "tertiary": "#824625",
                        "surface-tint": "#006a68",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#4c6a68",
                        "primary": "#00605e",

                        "on-primary-fixed": "#00201f",
                        "surface-container-high": "#e5e9e8",

                    }

<style>
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            background-color: #f7faf9;
            color: #181c1c;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col bg-background">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-background w-full top-0 flat no shadows flex items-center justify-between px-4 h-16 max-w-7xl mx-auto direction-rtl">
<div class="flex items-center gap-4">
<button class="text-on-surface-variant dark:text-outline hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-colors active:scale-95 duration-150 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-headline text-xl font-bold text-primary dark:text-primary-fixed-dim">كوبا</h1>
</div>
<div>
<!-- Navigation hidden as per intent -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-4 md:p-8 relative">
<!-- Abstract decorative background shape to add a high-end feel without violating image constraints -->
<div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
<div class="absolute -top-40 -right-40 w-96 h-96 bg-primary-container opacity-5 rounded-full blur-3xl"></div>
<div class="absolute -bottom-40 -left-40 w-96 h-96 bg-tertiary-container opacity-5 rounded-full blur-3xl"></div>
</div>
<div class="w-full max-w-md z-10 relative">
<!-- Glassmorphism Card Container -->
<div class="bg-surface-container-lowest/80 backdrop-blur-xl border border-surface-variant/50 rounded-2xl shadow-sm p-8 flex flex-col gap-8">
<!-- Header Section -->
<div class="text-center flex flex-col gap-3">
<h2 class="font-display text-3xl font-bold text-on-background">تسجيل الدخول</h2>
<p class="font-body text-on-surface-variant text-base leading-relaxed">يرجى تسجيل الدخول باستخدام حساب Google الخاص بك للمتابعة.</p>
</div>
<!-- Action Section -->
<div class="flex flex-col gap-6">
<!-- Google Sign In Button -->
<button class="w-full bg-surface-container-lowest text-on-background border border-outline-variant hover:bg-surface-container-low focus:ring-2 focus:ring-primary focus:outline-none focus:ring-offset-2 transition-all duration-200 py-3.5 px-4 rounded-[12px] flex items-center justify-center gap-3 shadow-sm group">
<!-- Custom Google G Icon (SVG) -->
<svg class="w-5 h-5 group-active:scale-95 transition-transform" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-label font-semibold text-[15px]">المتابعة باستخدام Google</span>
</button>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3 mt-2">
<div class="flex items-center h-5">
<input aria-describedby="terms-error" class="w-4 h-4 text-primary bg-surface-container border-outline rounded focus:ring-primary focus:ring-2 focus:ring-offset-1 cursor-pointer transition-colors duration-200" id="terms" type="checkbox"/>
</div>
<label class="font-body text-sm text-on-surface-variant cursor-pointer select-none leading-tight" for="terms">
                            أوافق على 
                            <a class="text-primary hover:text-primary-container underline decoration-primary/30 hover:decoration-primary transition-colors font-medium" href="#">الشروط والأحكام</a> 
                            و 
                            <a class="text-primary hover:text-primary-container underline decoration-primary/30 hover:decoration-primary transition-colors font-medium" href="#">سياسة الخصوصية</a>
</label>
</div>
<!-- Reserved Error Area -->
<div class="min-h-[20px] px-1 transition-all duration-300 opacity-0 transform -translate-y-1" id="terms-error">
<p class="text-error text-xs font-label flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">error</span>
                            يرجى الموافقة على الشروط للمتابعة
                        </p>
</div>
</div>
</div>
<!-- Context Footer -->
<div class="mt-8 text-center">
<p class="font-body text-sm text-on-surface-variant">
                    ليس لديك حساب؟ 
                    <!-- Though prompt says 'Already have an account?', standard context for sign in implies creating one if not existing, or just leaving it neutral as Google handles both. Keeping true to prompt requested text -->
<span class="text-on-surface-variant">لديك حساب بالفعل؟</span>
</p>
</div>
</div>
</main>
<!-- Footer -->
<footer class="bg-transparent flex flex-col items-center gap-2 p-6 w-full direction-rtl">
<div class="flex gap-4 mb-2">
<a class="font-label text-xs text-on-surface-variant dark:text-outline hover:text-primary dark:hover:text-primary-fixed-dim underline cursor-pointer transition-colors" href="#">الشروط والأحكام</a>
<a class="font-label text-xs text-on-surface-variant dark:text-outline hover:text-primary dark:hover:text-primary-fixed-dim underline cursor-pointer transition-colors" href="#">سياسة الخصوصية</a>
</div>
<p class="font-label text-xs text-on-surface-variant dark:text-outline-variant">© كوبا ٢٠٢٤. جميع الحقوق محفوظة.</p>
</footer>
<script>
        // Simple micro-interaction for the checkbox error demonstration
        document.querySelector('button').addEventListener('click', function(e) {
            const checkbox = document.getElementById('terms');
            const errorArea = document.getElementById('terms-error');
            
            if (!checkbox.checked) {
                e.preventDefault();
                errorArea.classList.remove('opacity-0', '-translate-y-1');
                errorArea.classList.add('opacity-100', 'translate-y-0');
                
                // Add a subtle shake to the checkbox
                checkbox.parentElement.animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(4px)' },
                    { transform: 'translateX(-4px)' },
                    { transform: 'translateX(4px)' },
                    { transform: 'translateX(0)' }
                ], {
                    duration: 300,
                    easing: 'ease-in-out'
                });
            } else {
                errorArea.classList.add('opacity-0', '-translate-y-1');
                errorArea.classList.remove('opacity-100', 'translate-y-0');
                // Proceed with auth flow here
                console.log('Proceeding to Google Auth');
            }
        });

        // Hide error on change
        document.getElementById('terms').addEventListener('change', function() {
            const errorArea = document.getElementById('terms-error');
            if(this.checked) {
                errorArea.classList.add('opacity-0', '-translate-y-1');
                errorArea.classList.remove('opacity-100', 'translate-y-0');
            }
        });
    </script>
</body></html>
