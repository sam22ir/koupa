<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Koupa - Splash Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",

                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#ffb692",
                        "outline-variant": "#bdc9c8",

                        "secondary-container": "#c8e9e7",

                        "surface-tint": "#006a68",
                        "tertiary-fixed": "#ffdbcb",
                        "surface-dim": "#d7dbda",
                        "primary": "#00605e",
                        "background": "#f7faf9",
                        "on-tertiary": "#ffffff",
                        "surface": "#f7faf9",
                        "tertiary": "#824625",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#f1f4f3",
                        "primary-fixed": "#9df1ee",
                        "secondary-fixed": "#c8e9e7",
                        "primary-container": "#1a7a78",
                        "surface-variant": "#e0e3e2",
                        "on-secondary-fixed-variant": "#2e4c4b",
                        "inverse-on-surface": "#eef1f0",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#e0e3e2",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed": "#341100",
                        "on-background": "#181c1c",
                        "surface-bright": "#f7faf9",
                        "on-primary-fixed": "#00201f",
                        "surface-container-high": "#e5e9e8",
                        "on-error": "#ffffff",
                        "outline": "#6e7978",
                        "on-secondary-container": "#4c6a68",

                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-container": "#ffeee7",
                        "inverse-surface": "#2d3131",
                        "inverse-primary": "#81d5d2",
                        "tertiary-container": "#9f5d3a",
                        "primary-fixed-dim": "#81d5d2",
                        "on-surface-variant": "#3e4948",
                        "on-primary-fixed-variant": "#00504e",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#adcdcb",
                        "on-tertiary-fixed-variant": "#703717"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {},
                    "fontFamily": {
                        "headline": ["IBM Plex Sans Arabic", "sans-serif"],
                        "display": ["IBM Plex Sans Arabic", "sans-serif"],
                        "body": ["IBM Plex Sans Arabic", "sans-serif"],
                        "label": ["Public Sans", "sans-serif"]
                    },
                    "fontSize": {}
                },
            },
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Subtle pulse animation for loading indicator */
        @keyframes subtlePulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }
        .loading-dot {
            animation: subtlePulse 1.5s infinite ease-in-out;
        }
        .loading-dot:nth-child(1) { animation-delay: 0s; }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col items-center justify-between p-8 antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Spacing -->
<div class="w-full flex-1"></div>
<!-- Center: Official Logo Placeholder -->
<!-- The prompt strictly dictates a placeholder div for the official logo -->
<div class="flex-1 flex items-center justify-center w-full max-w-sm mx-auto">
<div class="w-48 h-48 sm:w-64 sm:h-64 rounded-full bg-surface-container flex flex-col items-center justify-center border border-outline-variant/30 shadow-sm relative overflow-hidden group">
<!-- A subtle, non-intrusive geometric abstraction within the placeholder to suggest 'space reserved for official branding' without generating a fake logo -->
<div class="absolute inset-0 bg-gradient-to-tr from-surface to-surface-container-high opacity-50"></div>
<div class="z-10 text-center space-y-4">
<span class="material-symbols-outlined text-4xl text-outline-variant block mb-2 opacity-50 font-light" style="font-variation-settings: 'wght' 200;">
                    image
                </span>
<p class="text-xs font-label text-outline uppercase tracking-widest font-medium">
                    شعار كوبا
                </p>
<p class="text-[10px] text-outline-variant font-label max-w-[120px] mx-auto">
                    Koupa Official Branding Space
                </p>
</div>
</div>
</div>
<!-- Bottom: Elegant Loading Indicator -->
<div class="w-full flex-1 flex flex-col justify-end items-center pb-12">
<div aria-label="جاري التحميل" class="flex items-center justify-center space-x-3 rtl:space-x-reverse">
<div class="loading-dot w-2.5 h-2.5 rounded-full bg-primary-container"></div>
<div class="loading-dot w-2.5 h-2.5 rounded-full bg-primary-container"></div>
<div class="loading-dot w-2.5 h-2.5 rounded-full bg-primary-container"></div>
</div>
</div>
</body></html>
